[Diagnostics]
; Creates a temporary hidden 64x64 D3D9 device so hooks can be installed even
; if the game created its real device before OctoGraphics Load() ran.
CreateDiagnosticDevice=1

; Writes a compact frame summary every N Presents.
ContinuousSummary=1
SummaryIntervalFrames=300

; These only affect the one-frame Ctrl+Shift+F10 trace.
TraceDrawCalls=1
TraceShaderConstants=1
TraceWorldTransforms=1
SsaoTest=1
SmaaEnabled=1

[Graphics]
; These are the approved OctoGraphics defaults. They can all be changed live
; from the in-game menu with Ctrl+Shift+F11.
HbaoEnabled=1
HbaoRadius=0.9500
HbaoBias=0.0800
HbaoMultiplier=1.3500
HbaoPower=1.2500
HbaoIntensity=0.9000
HbaoScreenRadiusCap=48.0000
HbaoFullStrengthDistance=96.0000
HbaoFadeDistance=160.0000
HbaoHardCutoffDistance=176.0000
HbaoFarRadiusScale=0.5000
HbaoFullDepthGapNear=0.1000
HbaoFullDepthGapFar=0.0500
HbaoMaximumDepthGapNear=0.4000
HbaoMaximumDepthGapFar=0.2000
HbaoBlurSharpness=1.0000

; SMAA quality: 0=Low, 1=Medium, 2=High, 3=Ultra.
; All four choices are SMAA 1x post-process presets. Native WoW MSAA must stay off.
SmaaEnabled=1
SmaaQuality=2

DofEnabled=1
DofBlurStartDistance=22.0000
DofFullBlurDistance=90.0000
DofStrength=0.7000
DofRadius=6.0000

; Fog mode: 0=Vanilla WoW fog, 1=OctoFog replacement, 2=Fog disabled.
; OctoFog always uses the live fog color and base distances selected by WoW.
FogMode=1
FogDensity=1.0000
FogStartScale=1.0000
FogEndScale=1.0000
FogHeightDensity=0.0800
FogHeightFalloff=0.0350
FogColorStrength=1.0000
FogPreset=0
FogUseCustomColor=0
FogCustomRed=0.5000
FogCustomGreen=0.5000
FogCustomBlue=0.5000
FogLayerElevation=0.0000
LightingEnabled=1
LightingExposure=0.0000
LightingContrast=1.0400
LightingSaturation=1.0300
LightingTemperature=0.0000
LightingBloomStrength=0.1200
LightingBloomThreshold=0.7800
LightingBloomRadius=2.0000
OctoLightEnabled=1
OctoLightNativeEnhancement=1
OctoLightIntensity=0.3500
OctoLightRadius=0.5000
OctoLightFlickerStrength=0.0600
OctoLightFlickerSpeed=5.0000
